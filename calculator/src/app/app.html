<main>
  <h1>Calculator</h1>
  <input type="number" aria-label="a" [ngModel]="a()" (ngModelChange)="a.set($event ?? 0)" />
  <select aria-label="operation" [ngModel]="op()" (ngModelChange)="op.set($event)">
    @for (o of operations; track o) {
      <option [value]="o">{{ o }}</option>
    }
  </select>
  <input type="number" aria-label="b" [ngModel]="b()" (ngModelChange)="b.set($event ?? 0)" />
  <p>= <output>{{ result() }}</output></p>
</main>
